# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Vulkan on Windows (clang-cl)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  BUILD_DIR: ${{ github.workspace }}/build-windows-vk
  # vcpkg stores built packages as archives here, which lets us cache them between runs.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
        lfs: true

    - name: Setup MSVC dev environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Vulkan SDK
      # Exports VULKAN_SDK, which CMake's find_package(Vulkan) relies on.
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: latest
        install_runtime: true
        cache: true
        stripdown: true

    - name: Setup shader build environment
      # ShaderListParser.py imports ninja_syntax, so install it into the very interpreter CMake will use.
      run: |
        python -m pip install ninja
        $python = python -c "import sys; print(sys.executable)"
        Write-Host "Python: $python"
        python -c "from ninja import ninja_syntax; print(ninja_syntax.__file__)"
        "PYTHON_EXE=$python" >> $env:GITHUB_ENV

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: windows-vk-clang-cl-${{ env.BUILD_TYPE }}
        max-size: 500M

    - name: Restore vcpkg binary cache
      run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE

    - uses: actions/cache/restore@v4
      id: vcpkg-cache
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-freetype-x64-windows-static-md-v1

    - name: Install FreeType
      # Static lib with dynamic CRT, so no extra DLL has to ship with the tests.
      run: |
        vcpkg install freetype:x64-windows-static-md
        $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
        Write-Host "FreeType prefix: $prefix"
        Get-ChildItem "$prefix/lib", "$prefix/include" | Select-Object -First 20
        "FREETYPE_PREFIX=$prefix" >> $env:GITHUB_ENV

    - name: Save vcpkg binary cache
      # Saved right after the install rather than at job end, so a later build failure doesn't discard it.
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-freetype-x64-windows-static-md-v1

    - name: Configure CMake
      run: >
        cmake -B ${{ env.BUILD_DIR }}
        -G Ninja
        -DCMAKE_C_COMPILER=clang-cl
        -DCMAKE_CXX_COMPILER=clang-cl
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_PREFIX_PATH=${{ env.FREETYPE_PREFIX }}
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DGraphicsApi=VK
        -DPython3_EXECUTABLE=${{ env.PYTHON_EXE }}

    - name: Build Core
      run: cmake --build ${{ env.BUILD_DIR }} --config ${{env.BUILD_TYPE}} --target KryneEngine_Core

    - name: Build Core Unit tests
      run: >
        cmake --build ${{ env.BUILD_DIR }} --config ${{env.BUILD_TYPE}} --target
        Core_Common_UnitTests
        Core_Graphics_UnitTests
        Core_Math_UnitTests
        Core_Memory_UnitTests
        Core_Platform_UnitTests
        Core_Threads_UnitTests

    - name: Upload Core Unit tests
      uses: actions/upload-artifact@v7
      with:
        name: core-unit-tests
        path: ${{ env.BUILD_DIR }}/Tests/Core

    - name: Build Modules
      run: >
        cmake --build ${{ env.BUILD_DIR }} --config ${{env.BUILD_TYPE}} --target
        KryneEngine_Modules_FileSystem
        KryneEngine_Modules_GraphicsUtils
        KryneEngine_Modules_GuiLib
        KryneEngine_Modules_ImGui
        KryneEngine_Modules_RenderGraph
        KryneEngine_Modules_Resources
        KryneEngine_Modules_SdfTexture
        KryneEngine_Modules_ShaderReflection
        KryneEngine_Modules_TextRendering
        KryneEngine_Modules_Box3D

    - name: Build Modules Unit tests
      run: >
        cmake --build ${{ env.BUILD_DIR }} --config ${{env.BUILD_TYPE}} --target
        Modules_FileSystem_UnitTests
        Modules_GraphicsUtils_UnitTests
        Modules_RenderGraph_UnitTests

    - name: Upload Modules Unit tests
      uses: actions/upload-artifact@v7
      with:
        name: modules-unit-tests
        path: ${{ env.BUILD_DIR }}/Tests/Modules

    - name: Build Samples
      run: >
        cmake --build ${{ env.BUILD_DIR }} --config ${{env.BUILD_TYPE}} --target
        HelloTriangle
        ImGuiDemo
        RenderGraphDemo
        UiDemo
        PhysicsDemo

  test-core:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download
        uses: actions/download-artifact@v7
        with:
          name: core-unit-tests
          path: ${{ env.BUILD_DIR }}/Tests/Core

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}/Tests/Core
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -E "Core_Graphics_UnitTests"
        # Disabled Core graphics test, as Github-hosted Windows runners have no Vulkan-capable GPU or software driver.

  test-modules:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download
        uses: actions/download-artifact@v7
        with:
          name: modules-unit-tests
          path: ${{ env.BUILD_DIR }}/Tests/Modules

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}/Tests/Modules
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
